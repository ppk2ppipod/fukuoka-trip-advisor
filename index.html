<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>봉봉자매의 후쿠오카 3만보걷고 정신줄놓기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;700;800&family=Outfit:wght@500;700&display=swap">
<style>
/* Kiosk: photo tiles on a 2x2 home board, tap one to open its detail sheet (hash routed). */
:root {
  --bg: #e7f0ef;
  --surface: #ffffff;
  --ink: #0d2421;
  --ink-soft: #3d5754;
  --line: #cfdfdc;
  --teal: #157f75;
  --teal-deep: #0e5c55;
  --teal-wash: #d5ece8;
  /* 항목 색: 진한 단색 바탕 + 흰 글씨 (모든 조합 4.5:1 이상) */
  --ramen: #b4470e;  --ramen-ink: #ffffff;
  --dish: #0b6a94;   --dish-ink: #ffffff;
  --shop: #5b3fc4;   --shop-ink: #ffffff;
  --park: #2b7a3d;   --park-ink: #ffffff;
  --open: #ffffff;   --open-wash: #1b7a47;
  --soon: #ffffff;   --soon-wash: #a65800;
  --shut: #ffffff;   --shut-wash: #a33a3a;
  --cta: #136a62;
  --shadow: 0 6px 18px rgba(18, 48, 45, .10);
  --font: "Gothic A1", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --brand: "Outfit", "Gothic A1", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1615; --surface: #182927; --ink: #f1f8f7; --ink-soft: #b4ccc8; --line: #2c4743;
    --teal: #5fd0c3; --teal-deep: #7fe0d4; --teal-wash: #1d4743;
    --shadow: 0 6px 18px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1615; --surface: #182927; --ink: #f1f8f7; --ink-soft: #b4ccc8; --line: #2c4743;
  --teal: #5fd0c3; --teal-deep: #7fe0d4; --teal-wash: #1d4743;
  --shadow: 0 6px 18px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--teal); color: #fff; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: 12px; }
.app { max-width: 520px; margin: 0 auto; padding-bottom: 32px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
svg.i { width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Home ---------- */
.hero { position: relative; height: 240px; overflow: hidden; }
.hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 60%; display: block; }
.hero::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.0) 78%, var(--bg) 100%); }
.brand { position: absolute; top: 18px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.brand h1 { margin: 0; font-family: var(--font); font-weight: 800; font-size: clamp(20px, 6vw, 26px); line-height: 1.28; max-width: 100%; letter-spacing: -0.04em; word-break: keep-all;
  color: #0b4f49; background: rgba(255,255,255,.95); padding: 9px 14px 10px 10px; border-radius: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,.18); display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
.brand h1 svg { flex: none; width: 30px; height: 30px; margin-top: 1px; fill: #138a7f; stroke: none; }
.clock { background: rgba(255,255,255,.9); color: #12302d; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700;
  white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.clock small { font-weight: 600; color: #4b6663; margin-right: 4px; }
.wx-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--cta); color: #fff; }
.wx-bar .back { font-size: 16px; padding: 10px 16px 10px 12px; }
.wx-bar b { flex: 1; font-size: 17px; font-weight: 800; }
.wx-out { display: inline-flex; align-items: center; gap: 4px; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
.wx-frame { display: block; width: 100%; height: calc(100dvh - 64px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); border: 0; background: #fff; }
.app:has(.wx-frame) { padding-bottom: 0; max-width: none; }
.top-r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.weather { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; background: #ffffff; color: #0e5c55;
  font-size: 14px; font-weight: 800; padding: 4px 12px 4px 6px; border-radius: 999px; box-shadow: 0 3px 12px rgba(0,0,0,.16); white-space: nowrap; }
.wx { width: 38px; height: 32px; flex: none; }
.wx-sun { transform-origin: 17px 17px; animation: wx-spin 14s linear infinite; }
@keyframes wx-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .wx-sun { animation: none; } }

.lede { margin: -18px 0 18px; position: relative; z-index: 1; color: var(--ink-soft); font-size: 15px; }
.lede b { color: var(--ink); }
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; display: block; aspect-ratio: 1 / 1; border-radius: 22px; overflow: hidden; text-decoration: none;
  box-shadow: var(--shadow); background: var(--surface); max-width: 100%; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s cubic-bezier(.16,1,.3,1); }
.tile:active img { transform: scale(1.04); }
.tile .cap { position: absolute; inset: auto 0 0 0; padding: 40px 12px 12px; color: #fff;
  background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.72)); display: flex; align-items: flex-end; gap: 8px; }
.tile .cap div { min-width: 0; flex: 1; }
.tile .cap strong { display: flex; align-items: center; gap: 4px; font-size: 19px; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
.tile .cap span { display: block; font-size: 13px; opacity: .92; margin-top: 2px; }
.tile .go { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.28); backdrop-filter: blur(6px);
  display: grid; place-items: center; flex: none; font-size: 18px; }
.tile.empty { border: 2px dashed var(--line); background: transparent; box-shadow: none; display: grid; place-items: center;
  text-align: center; color: var(--ink-soft); font-size: 14px; padding: 12px; }
.tile.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
.note { margin-top: 18px; font-size: 13px; color: var(--ink-soft); }

/* ---------- Detail ---------- */
.d-hero { position: relative; height: 230px; overflow: hidden; }
.d-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.d-hero::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.42) 55%, rgba(0,0,0,0) 78%),
              linear-gradient(180deg, transparent 70%, var(--bg) 100%); }
.d-top { position: absolute; z-index: 1; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; background: rgba(255,255,255,.92); color: #0f5f58;
  font-weight: 700; font-size: 14px; padding: 8px 14px 8px 10px; border-radius: 999px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
.pill-brand { font-family: var(--brand); font-weight: 700; font-size: 13px; color: #fff; background: rgba(19,106,98,.85);
  padding: 6px 12px; border-radius: 999px; }
.d-title { position: absolute; z-index: 1; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: 64px; color: #fff; }
.d-title h2 { margin: 0; font-size: 34px; font-weight: 800; line-height: 1.12; letter-spacing: -0.03em; text-shadow: 0 2px 14px rgba(0,0,0,.45); text-wrap: balance; }
.d-title p { margin: 8px 0 0; font-size: 15px; font-weight: 700; display: inline-block; background: rgba(8,30,28,.72);
  padding: 4px 10px; border-radius: 10px; }

.sections { margin-top: -26px; position: relative; z-index: 2; display: grid; gap: 22px; }
.sec { display: grid; gap: 12px; }
.sec-head { margin: 0; padding: 0 4px; }
.sec-head h3 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.sec-head h3 svg { color: var(--teal); }
.sec-head p { margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); }
.sec-head .map { margin-top: 8px; }

.place { display: grid; grid-template-columns: 112px 1fr; gap: 12px; background: var(--surface); border-radius: 20px;
  padding: 10px; box-shadow: var(--shadow); align-items: stretch; }
.place .thumb { border-radius: 14px; overflow: hidden; min-height: 120px; }
.place .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.place .thumb.icon { display: grid; place-items: center; font-size: 44px; }
.place .thumb.icon svg { stroke-width: 1.6; }
.place .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 2px 2px 2px 0; }
.tone-ramen { background: var(--ramen); color: var(--ramen-ink); }
.tone-dish { background: var(--dish); color: var(--dish-ink); }
.tone-shop { background: var(--shop); color: var(--shop-ink); }
.tone-park { background: var(--park); color: var(--park-ink); }
.chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 17px;
  padding: 4px 12px 4px 10px; border-radius: 999px; letter-spacing: -0.02em; max-width: 100%; }
.chip small { font-weight: 600; font-size: 13px; opacity: .92; white-space: nowrap; }
.tile.wide { grid-column: 1 / -1; aspect-ratio: 2 / 1; }
.etc { grid-column: 1 / -1; margin: 8px 0 -4px; font-size: 18px; font-weight: 800; color: var(--ink); }
.pick { align-self: flex-start; font-size: 13px; font-weight: 800; color: #fff; background: #c2185b; padding: 3px 10px; border-radius: 999px; }
.bul { display: flex; flex-wrap: wrap; gap: 5px; }
.bul span { font-size: 13px; font-weight: 700; color: var(--ink); background: var(--bg); padding: 3px 9px; border-radius: 8px; }
.tip.desc { grid-column: 1 / -1; font-size: 15px; color: var(--ink); line-height: 1.6; border-top: 1px solid var(--line); padding: 10px 2px 2px; }
.what { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; }
.hours { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.tip { font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
.tip b { color: var(--ink); font-weight: 700; }
.status { font-size: 13px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.status.open { color: var(--open); background: var(--open-wash); }
.status.soon { color: var(--soon); background: var(--soon-wash); }
.status.shut { color: var(--shut); background: var(--shut-wash); }
.links { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; }
.map { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  font-size: 14px; font-weight: 700; color: var(--teal-deep); background: var(--teal-wash); padding: 7px 12px; border-radius: 12px; min-height: 36px; }
.map.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-soft); }

/* 매장 안 층별 목록 (이온몰) */
.floors { grid-column: 1 / -1; list-style: none; margin: 2px 0 0; padding: 0; border-top: 1px solid var(--line); }
.floors li { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: center; padding: 10px 2px; font-size: 15px; }
.floors li + li { border-top: 1px solid var(--line); }
.floors .fl { font-family: var(--brand); font-weight: 700; font-size: 14px; color: var(--teal-deep); background: var(--teal-wash);
  border-radius: 8px; text-align: center; padding: 3px 0; }
.floors .nm { min-width: 0; font-weight: 700; }
.floors .nm small { display: block; font-weight: 400; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* 이름만 있는 작은 장소 묶음 */
.minis { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); list-style: none; margin: 0; padding: 4px 14px; }
.minis li { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; }
.minis li + li { border-top: 1px solid var(--line); }
.sec-img { width: 100%; height: 170px; object-fit: cover; display: block; border-radius: 20px; box-shadow: var(--shadow); }
img.ico { object-fit: cover; }
.minis li { grid-template-columns: 56px 1fr auto !important; }
.minis .ico { width: 56px !important; height: 56px !important; }
.minis .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; }
.minis .tx { min-width: 0; }
.minis .tx b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.minis .tx span { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
.minis .pin { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--teal-wash);
  color: var(--teal-deep); font-size: 18px; }

.facts { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: repeat(3, 1fr); padding: 14px 6px; margin: 22px 0 0; }
.facts > div { min-width: 0; padding: 0 10px; display: grid; gap: 4px; align-content: start; }
.facts > div + div { border-left: 1px solid var(--line); }
.facts dt { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--ink); }
.facts dt svg { color: var(--teal); font-size: 16px; }
.facts dd { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
.home-btn { margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px;
  background: var(--cta); color: #fff; text-decoration: none; font-size: 18px; font-weight: 800; border-radius: 18px;
  box-shadow: 0 8px 20px rgba(19,106,98,.3); }

/* ---------- 챙겨야 할 것 ---------- */
.pack-btn { margin-top: 14px; display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
  background: var(--surface); border-radius: 22px; padding: 14px 16px 14px 14px; text-decoration: none; box-shadow: var(--shadow); }
.pack-btn .ico { width: 56px; height: 56px; border-radius: 16px; background: var(--cta); color: #fff; display: grid; place-items: center; font-size: 30px; }
.pack-btn b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.pack-btn span.sub { display: block; font-size: 13px; color: var(--ink-soft); }
.pack-btn .count { font-family: var(--brand); font-weight: 700; font-size: 15px; color: var(--teal-deep); background: var(--teal-wash);
  padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pack-btn .count.done { background: var(--open-wash); color: var(--open); }

.p-head { padding-block: 14px 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.p-head .back { background: var(--surface); color: var(--teal-deep); }
.p-title { margin: 14px 0 4px; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
.p-lede { margin: 0 0 18px; color: var(--ink-soft); font-size: 15px; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 18px; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: 999px; transition: width .4s cubic-bezier(.16,1,.3,1); }
.packs { display: grid; gap: 14px; }
.pk { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
.pk .art { height: 132px; display: grid; place-items: center; font-size: 84px; position: relative; }
.pk .art svg { stroke-width: 1.3; }
.pk .art .no { position: absolute; top: 12px; left: 14px; font-family: var(--brand); font-weight: 700; font-size: 14px; opacity: .7; }
.pk .txt { padding: 16px 18px 18px; display: grid; gap: 8px; }
.pk h3 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.pk p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ink-soft); }
.pk p b { color: var(--ink); }
.pk .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.pk .tags span { font-size: 14px; font-weight: 700; padding: 5px 11px; border-radius: 999px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 52px; border-radius: 16px; padding: 0 16px; margin-top: 4px;
  background: var(--bg); border: 0; font: inherit; font-size: 16px; font-weight: 800; color: var(--ink); cursor: pointer; width: 100%; }
.check .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--ink-soft); display: grid; place-items: center; color: transparent; font-size: 18px; }
.check[aria-pressed="true"] { background: var(--open-wash); color: var(--open); }
.check[aria-pressed="true"] .box { background: #fff; border-color: #fff; color: var(--open-wash); }
.pk.is-done .art { filter: saturate(.4); opacity: .75; }

/* ---------- 여행 일정 ---------- */
.trip { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 18px; display: grid; gap: 14px; }
.trip-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.trip-head h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; text-wrap: balance; }
.trip-head p { margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); font-weight: 600; }
.dday { flex: none; font-family: var(--brand); font-weight: 700; font-size: 18px; color: #fff; background: #c2185b; padding: 6px 12px; border-radius: 14px; font-variant-numeric: tabular-nums; }
.t-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.t-tab { position: relative; display: grid; gap: 1px; justify-items: center; padding: 10px 4px; border-radius: 16px; border: 0; cursor: pointer;
  background: var(--bg); color: var(--ink); font: inherit; min-height: 60px; }
.t-tab b { font-size: 16px; font-weight: 800; }
.t-tab span { font-size: 13px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.t-tab[aria-pressed="true"] { background: var(--cta); color: #fff; box-shadow: 0 6px 14px rgba(19,106,98,.3); }
.t-tab[aria-pressed="true"] span { color: rgba(255,255,255,.9); }
.t-tab em { position: absolute; top: -7px; right: 6px; font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: #c2185b; padding: 1px 7px; border-radius: 999px; }
.t-list { list-style: none; margin: 0; padding: 0; }
.t-list li { display: grid; grid-template-columns: 52px 18px 1fr; gap: 6px; align-items: start; position: relative; }
.t-list li::before { content: ""; position: absolute; left: 66px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.t-list li:first-child::before { top: 14px; } .t-list li:last-child::before { bottom: calc(100% - 14px); }
.t-time { font-size: 14px; font-weight: 800; color: var(--teal-deep); text-align: right; padding-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-dot { position: relative; z-index: 1; width: 12px; height: 12px; margin: 8px auto 0; border-radius: 50%; background: var(--surface); border: 3px solid var(--teal); }
.t-body { min-width: 0; padding: 2px 0 14px; display: grid; gap: 3px; }
.t-what { display: inline-flex; align-items: center; gap: 2px; justify-self: start; font-size: 16px; font-weight: 800; color: var(--ink); line-height: 1.4; }
a.t-what { text-decoration: underline; text-decoration-color: var(--teal); text-decoration-thickness: 2px; text-underline-offset: 4px; }
a.t-what svg { color: var(--teal); font-size: 16px; }
.t-body small { font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
.t-alts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.t-alts span { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: var(--soon-wash); color: #fff; }
.t-more { border-top: 1px solid var(--line); padding-top: 12px; }
.t-more summary { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 16px; font-weight: 800; list-style: none; min-height: 40px; }
.t-more summary::-webkit-details-marker { display: none; }
.t-more summary::after { content: "펼치기"; margin-left: auto; font-size: 13px; font-weight: 700; color: var(--teal-deep); background: var(--teal-wash); padding: 4px 10px; border-radius: 999px; }
.t-more[open] summary::after { content: "접기"; }
.t-more summary svg { color: var(--teal); }
.t-info { display: grid; gap: 10px; margin-top: 10px; }
.t-card { background: var(--bg); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; }
.t-card h3 { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; }
.t-card h3 svg { color: var(--teal); }
.t-card small { font-size: 13px; color: var(--ink-soft); }
.who { display: inline-block; justify-self: start; font-size: 13px; font-weight: 800; padding: 2px 10px; border-radius: 999px; }
.f-who { display: grid; gap: 6px; }
.f-who + .f-who { border-top: 1px solid var(--line); padding-top: 10px; }
.f-leg { display: grid; gap: 1px; }
.f-leg b { font-size: 15px; font-weight: 800; }
.f-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.f-no { font-family: var(--brand); font-weight: 700; background: var(--surface); padding: 1px 7px; border-radius: 6px; }
.f-air { color: var(--ink-soft); font-weight: 600; }
.h-name { font-size: 16px; font-weight: 800; }
.h-io { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.h-io span { background: var(--surface); border-radius: 12px; padding: 6px 10px; display: grid; }
.h-io b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.h-paid { font-weight: 700; color: var(--open-wash) !important; }
.c-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 15px; font-weight: 700; }
.c-row b { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* ---------- 교통 안내 ---------- */
.route { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 10px; }
.r-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.r-head > b { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; }
.r-head > b svg { color: var(--teal); font-size: 18px; }
.r-sum { display: flex; gap: 6px; flex-wrap: wrap; }
.r-sum span { font-size: 13px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--teal-wash); color: var(--teal-deep); font-variant-numeric: tabular-nums; }
.r-sum span:nth-child(2) { background: var(--cta); color: #fff; }
.r-steps { list-style: none; margin: 0; padding: 0 0 0 4px; }
.r-steps li { --c: var(--teal); position: relative; display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
.r-steps .l-sub { --c: #e8650a; }   /* 지하철 공항선 */
.r-steps .l-nt { --c: #0b6a94; }    /* 니시테츠 텐진오무타선 */
.r-steps .l-nt2 { --c: #5b3fc4; }   /* 니시테츠 다자이후선 */
.r-steps li i { position: relative; display: block; }
.r-steps .st i::before { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--surface); border: 4px solid var(--c); box-sizing: border-box; }
.r-steps .ride i::before { content: ""; position: absolute; left: 8px; top: -4px; bottom: -4px; width: 6px; border-radius: 3px; background: var(--c); }
.r-steps .st div { padding-bottom: 2px; }
.r-steps .st b { display: block; font-size: 15px; font-weight: 800; line-height: 1.4; }
.r-steps small { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
.r-steps .ride div { padding: 8px 0; }
.r-steps .ride small { font-weight: 700; color: var(--ink); }

/* ---------- 스시자로: 가격 ---------- */
.compare { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 18px; }
.rank h4 { margin: 0 0 8px; font-size: 18px; font-weight: 800; display: flex; align-items: baseline; gap: 6px; }
.rank h4 small { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.rank ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.jp { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-top: -2px; }
.rank li { display: grid; grid-template-columns: 76px 1fr auto 34px; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.rank li a { font-size: 15px; font-weight: 800; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line);
  text-underline-offset: 4px; text-decoration-thickness: 2px; white-space: nowrap; }
.rank .track { height: 14px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.rank .track i { display: block; height: 100%; border-radius: 999px; background: var(--dish); }
.rank .track i.hi { background: var(--shop); }
.rank li b { font-size: 16px; font-weight: 800; min-width: 54px; text-align: right; }
.rank li em { font-style: normal; font-size: 12px; font-weight: 800; color: #fff; background: var(--open-wash); padding: 2px 7px; border-radius: 999px; }
.prices { display: flex; gap: 8px; flex-wrap: wrap; }
.pr { display: grid; background: var(--bg); border-radius: 12px; padding: 6px 10px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.pr small { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.pr b { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.pr b i { font-style: normal; font-size: 13px; margin-left: 1px; }
.pr.hi { background: var(--shop); color: #fff; }
.pr.hi small { color: rgba(255,255,255,.88); }
.place .wide { grid-column: 1 / -1; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.kv { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.kv div { min-width: 0; }
.kv dt { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.kv dd { margin: 0; font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
.tip.warn { background: var(--soon-wash); color: #fff; padding: 8px 12px; border-radius: 12px; font-size: 14px; }
.tip.warn b { color: #fff; }
.map.line { background: #00843b; color: #fff; }
.place[id] { scroll-margin-top: 16px; }

@media (max-width: 360px) {
  .place { grid-template-columns: 92px 1fr; }
  .facts { grid-template-columns: 1fr; gap: 10px; }
  .facts > div + div { border-left: 0; border-top: 1px solid var(--line); padding-top: 10px; }
}
@media (prefers-reduced-motion: reduce) { .tile img { transition: none; } }

/* ---------- 여행지도 ---------- */
.pack-btn .ico.map-ico { background: #0b6a94; }
.pack-btn .go-ar { font-size: 26px; color: var(--teal-deep); display: grid; }
.app:has(.mapv) { max-width: none; padding-bottom: 0; }
.mapv { position: fixed; inset: 0; background: #dde6e4; overflow: hidden; }
.lmap { position: absolute; inset: 0; z-index: 0; background: #dde6e4; }
.m-fail { position: absolute; top: 40%; left: 16px; right: 16px; text-align: center; font-weight: 700; color: #33424d; }
.m-top { position: absolute; z-index: 600; top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: center; }
.m-top .back { background: #fff; color: #0e5c55; box-shadow: 0 3px 12px rgba(0,0,0,.2); min-height: 44px; flex: none; }
.m-origin { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.96); color: #12302d;
  font-size: 13px; font-weight: 700; padding: 0 12px; min-height: 44px; border-radius: 999px; box-shadow: 0 3px 12px rgba(0,0,0,.2); }
.m-origin span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-origin svg { color: #1a73e8; font-size: 16px; }
.m-loc { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; color: #1a73e8; font-size: 22px;
  display: grid; place-items: center; box-shadow: 0 3px 12px rgba(0,0,0,.2); cursor: pointer; }
.mapv .leaflet-top { margin-top: calc(env(safe-area-inset-top, 0px) + 60px); }
.mapv .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,.8); border-radius: 6px 0 0 6px; }

.m-sheet { position: absolute; z-index: 600; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 58dvh;
  display: flex; flex-direction: column; background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0;
  box-shadow: 0 -8px 28px rgba(0,0,0,.2); padding: 0 12px calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.m-handle { flex: none; align-self: stretch; height: 24px; border: 0; background: none; position: relative; cursor: pointer; }
.m-handle::before { content: ""; position: absolute; left: 50%; width: 48px; margin-left: -24px; top: 9px; height: 5px; border-radius: 3px; background: var(--line); }
.m-sheet.mini .m-tabs, .m-sheet.mini .m-list, .m-sheet.mini .m-note { display: none; }
.m-sheet.mini .m-res { border-bottom: 0; margin-bottom: 0; }

.m-hint { margin: 0 0 8px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; color: var(--teal-deep); }
.m-res { flex: none; padding: 0 2px 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.m-res-h { display: flex; align-items: center; gap: 8px; }
.m-res-h small { flex: none; font-size: 12px; font-weight: 800; color: #fff; background: var(--c); padding: 3px 9px; border-radius: 999px; }
.m-res-h b { flex: 1; min-width: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-gmap { flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px 0 9px; border-radius: 999px;
  background: #1a73e8; color: #fff; font-size: 13px; font-weight: 800; text-decoration: none; white-space: nowrap; }
.m-gmap svg { font-size: 15px; }
.m-x { flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--bg); color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer; }
.m-stats { display: grid; grid-template-columns: .8fr 1fr 1fr; gap: 6px; margin-top: 8px; }
.m-stats .st { border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 10px 7px; background: var(--surface); color: var(--ink);
  text-align: left; font-family: var(--font); min-width: 0; }
.m-stats button.st { cursor: pointer; }
.m-stats button.st:disabled { opacity: .55; cursor: default; }

const ic = (id, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const findUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);

function tokyoNow() {
  const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", hour12: false })
    .formatToParts(new Date());
  const h = +parts.find(p => p.type === "hour").value % 24, m = +parts.find(p => p.type === "minute").value;
  return { h, m, min: h * 60 + m, label: `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}` };
}

function tokyoDay() {
  const w = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tokyo", weekday: "short" }).format(new Date());
  return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(w);
}

// 요일별 진료시간(schedule)이 있는 곳의 상태
function scheduleStatus(p) {
  const today = p.schedule.filter(r => r.days.includes(tokyoDay())).sort((a, b) => toMin(a.open) - toMin(b.open));
  const v = p.rows ? "진료" : "영업";
  if (!today.length) return { cls: "shut", text: p.rows ? "오늘 휴진" : "오늘 휴무" };
  const now = tokyoNow().min;
  for (const r of today) {
    const o = toMin(r.open), c = toMin(r.close);
    if (now < o) return { cls: "soon", text: r === today[0] ? `${r.open} 오픈` : `${r.open} 다시 ${v}` };
    if (now < c) return c - now <= 60 ? { cls: "soon", text: `${c - now}분 뒤 마감` } : { cls: "open", text: `지금 ${v}중` };
  }
  return { cls: "shut", text: `오늘 ${v} 끝` };
}

function status(p) {
  if (p.schedule) return scheduleStatus(p);
  if (!p.open) return null;
  const now = tokyoNow().min, o = toMin(p.open), c = toMin(p.close);
  if (now < o) return { cls: "soon", text: `${p.open} 오픈` };
  if (now >= c) return { cls: "shut", text: "오늘 영업 끝" };
  if (c - now <= 60) return { cls: "soon", text: `${c - now}분 뒤 마감` };
  return { cls: "open", text: "지금 영업중" };
}
const badge = p => { const s = status(p); return s ? `<span class="status ${s.cls}">${s.text}</span>` : ""; };

function links(p) {
  const out = [];
  if (p.map) out.push(`<a class="map" href="${p.map}" target="_blank" rel="noopener">${ic("pin")}지도 열기</a>`);
  if (p.find) out.push(`<a class="map" href="${findUrl(p.find)}" target="_blank" rel="noopener">${ic("pin")}지도에서 찾기</a>`);
  if (p.find2) out.push(`<a class="map" href="${findUrl(p.find2.q)}" target="_blank" rel="noopener">${ic("cup")}${p.find2.label}</a>`);
  if (p.blog) out.push(`<a class="map ghost" href="${p.blog}" target="_blank" rel="noopener">${ic("book")}참고 블로그</a>`);
  if (p.line) out.push(`<a class="map line" href="${p.line}" target="_blank" rel="noopener">${ic("chat")}LINE 열기</a>`);
  return out.length ? `<div class="links">${out.join("")}</div>` : "";
}

function placeCard(p) {
  const thumb = p.img
    ? `<div class="thumb"><img src="${p.img}" alt="${p.name}"></div>`
    : `<div class="thumb icon tone-${p.tone}">${ic(p.icon)}</div>`;
  const hours = p.schedule
    ? `<div class="hours">${ic("clock")}<span>${p.scheduleText.join("<br>")}</span>${badge(p)}</div>`
    : p.open
    ? `<div class="hours">${ic("clock")}<span>${p.hoursLabel ? p.hoursLabel + " " : ""}${p.open} ~ ${p.close}</span>${badge(p)}</div>` : "";
  const prices = p.prices ? `<div class="prices">${Object.entries(p.prices).map(([k, v]) =>
      `<span class="pr ${k === "7.5mg" ? "hi" : ""}"><small>${k}</small><b>${v.toLocaleString("ko-KR")}<i>엔</i></b></span>`).join("")}</div>` : "";
  const kv = p.rows ? `<dl class="kv">${p.rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>` : "";
  const floors = p.floors ? `<ul class="floors">${p.floors.map(f => `
      <li><span class="fl">${f.fl}</span>
        <span class="nm">${f.name}<small>${[f.desc, f.open ? `${f.open} ~ ${f.close}` : ""].filter(Boolean).join(", ")}</small></span>
        ${badge(f)}</li>`).join("")}</ul>` : "";
  return `
    <article class="place"${p.key ? ` id="${p.anchor}-${p.key}"` : ""}>
      ${thumb}
      <div class="body">
        ${p.rows
          ? `<span class="chip tone-${p.tone}">${ic(p.icon)}${p.name}</span><span class="jp">${p.kind}</span>`
          : `<span class="chip tone-${p.tone}">${ic(p.icon)}${p.name} <small>${p.kind}</small></span>`}
        ${p.pick ? `<span class="pick">${p.pick}</span>` : ""}
        <p class="what">${p.what}</p>
        ${p.bullets ? `<div class="bul">${p.bullets.map(b => `<span>${b}</span>`).join("")}</div>` : ""}
        ${prices}
        ${hours}
        ${p.tip && !p.rows && !p.bullets ? `<div class="tip">${p.tip}</div>` : ""}
        ${p.rows ? "" : links(p)}
      </div>
      ${floors}
      ${p.bullets && p.tip ? `<p class="tip desc">${p.tip}</p>` : ""}
      ${p.route ? routeBlock(p.route) : ""}
      ${p.rows ? `<div class="wide">${kv}${p.tip ? `<div class="tip warn">${p.tip}</div>` : ""}${links(p)}</div>` : ""}
    </article>`;
}

function minis(list) {
  return `<ul class="minis">${list.map(m => `

}

// 텐진 출발 교통 안내 (간단 노선도)
function routeBlock(r) {
  return `<div class="route">
    <div class="r-head"><b>${ic("train")}텐진에서 가는 법</b>
      <span class="r-sum"><span>${r.time}</span><span>${r.fare}</span><span>${r.transfer}</span></span></div>
    <ol class="r-steps">${r.steps.map(s => s.kind === "st"
      ? `<li class="st l-${s.line}"><i></i><div><b>${s.name}</b><small>${s.note}</small></div></li>`
      : `<li class="ride l-${s.line}"><i></i><div><small>${s.note}</small></div></li>`).join("")}</ol>
  </div>`;
}

// 가격 비교 막대 (싼 순서)
function compare(c) {
  const max = Math.max(...c.rows.flatMap(r => Object.values(r.prices)));
  const block = dose => {
    const list = c.rows.filter(r => r.prices[dose]).sort((a, b) => a.prices[dose] - b.prices[dose]);
    return `<div class="rank"><h4>${dose} <small>1개월(4개)</small></h4><ol>${list.map((r, i) => `
      <li><a href="#${c.anchor}-${r.key}" data-jump>${r.name}</a>
        <span class="track"><i class="${dose === "7.5mg" ? "hi" : ""}" style="width:${(r.prices[dose] / max * 100).toFixed(1)}%"></i></span>
        <b>${r.prices[dose].toLocaleString("ko-KR")}</b>${i === 0 ? `<em>최저</em>` : "<span></span>"}</li>`).join("")}</ol></div>`;
  };
  return `<div class="compare">${block("7.5mg")}${block("5mg")}</div>`;
}

function detail(s) {
  const secs = s.sections.map(sec => `
    <section class="sec">
      ${sec.img ? `<img class="sec-img" src="${sec.img}" alt="${sec.title}">` : ""}
      ${sec.title ? `<div class="sec-head"><h3>${ic(sec.icon)}${sec.title}</h3>${sec.lede ? `<p>${sec.lede}</p>` : ""}
        ${sec.find ? `<a class="map" href="${findUrl(sec.find)}" target="_blank" rel="noopener">${ic("pin")}지하상가 지도</a>` : ""}</div>` : ""}
      ${sec.compare ? compare(sec.compare) : ""}
      ${(sec.places || []).map(placeCard).join("")}
      ${sec.minis ? minis(sec.minis) : ""}
    </section>`).join("");
  const facts = s.facts.map(f => `<div><dt>${ic(f.icon)}${f.k}</dt><dd>${f.v}</dd></div>`).join("");
  return `
    <header class="d-hero">
      <img src="${s.cover}" alt=""${s.coverPos ? ` style="object-position:${s.coverPos}"` : ""}>
      <div class="d-top">
        <a class="back" href="#">${ic("back")}목록</a>
        <span class="pill-brand">Fukuoka Trip Advisor</span>
      </div>
      <div class="d-title"><h2>${s.title}<br>(${s.sub})</h2><p>${s.tagline}</p></div>
    </header>
    <div class="gutter">
      <div class="sections">${secs}</div>
      <dl class="facts">${facts}</dl>
      <a class="home-btn" href="#">${ic("grid")}다른 일정 보기</a>
      ${s.credits ? `<p class="note">${s.credits}</p>` : ""}
    </div>`;
}

const geoDist = (a, b) => {
  const r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
};
const walkMin = m => m * 1.25 / 75;           // 직선거리 → 걷는 시간(분), 길 굽이 25% 가산
const stLL = n => [ST[n][2], ST[n][3]];
const lnglat = c => `${c[1].toFixed(5)},${c[0].toFixed(5)}`;
const fmtMin = m => { m = Math.max(1, Math.round(m)); return m < 60 ? `${m}분` : m % 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m / 60}시간`; };
const fmtM = m => m < 1000 ? `${Math.round(m / 10) * 10}<i>m</i>` : `${(m / 1000).toFixed(1)}<i>km</i>`;

function transitPlan(o, d) {
  const adj = { O: [] }, ids = Object.keys(ST);
  ids.forEach(n => adj[n] = []);
  ids.forEach(n => {
    const a = geoDist(o, stLL(n)), b = geoDist(stLL(n), d);
    if (a <= 1800) adj.O.push([n, walkMin(a) + WAIT, "walk"]);
    if (b <= 1800) adj[n].push(["D", walkMin(b), "walk"]);
  });
  RIDES.forEach(([a, b, t]) => { adj[a].push([b, t, "ride"]); adj[b].push([a, t, "ride"]); });
  XFER.forEach(([a, b, t]) => { adj[a].push([b, t, "xfer"]); adj[b].push([a, t, "xfer"]); });
  const dist = { O: 0 }, prev = {}, seen = new Set();
  for (;;) {
    let u = null;
    for (const k in dist) if (!seen.has(k) && (u === null || dist[k] < dist[u])) u = k;
    if (u === null || u === "D") break;
    seen.add(u);
    for (const [v, t, type] of adj[u] || []) {
      if (dist[v] === undefined || dist[u] + t < dist[v]) { dist[v] = dist[u] + t; prev[v] = [u, type, t]; }
    }
  }
  if (dist.D === undefined) return null;
  const edges = [];
  for (let v = "D"; v !== "O"; v = prev[v][0]) edges.unshift({ from: prev[v][0], to: v, type: prev[v][1], t: prev[v][2] });
  const legs = [];
  edges.filter(e => e.type === "ride").forEach(e => {
    const line = ST[e.from][1], last = legs[legs.length - 1];
    if (last && last.line === line && last.to === e.from) { last.to = e.to; last.stops++; last.chain.push(e.to); }
    else legs.push({ line, from: e.from, to: e.to, stops: 1, chain: [e.from, e.to] });
  });
  if (!legs.length) return null;
  return { min: dist.D, legs, edges, access: edges[0].t - WAIT, egress: edges[edges.length - 1].t };
}

    return `<button class="m-chip${mapS.sel === p.id ? " on" : ""}" type="button" data-map="pick" data-id="${p.id}" style="--c:${AREAS[p.area].c}"><b>${p.name}</b>${meta}</button>`;
  }).join("");
  document.querySelectorAll(".m-tab").forEach(b => b.setAttribute("aria-pressed", b.dataset.area === mapS.area));
}

function transitText(t) {
  const legs = t.legs.map(l => `<span class="ln" style="--c:${LINES[l.line].c}">${LINES[l.line].name}</span>${ST[l.from][0]} → ${ST[l.to][0]}${l.to === "t_dazaifu" || l.from === "t_dazaifu" ? " (후츠카이치에서 다자이후선 환승)" : ` ${l.stops}정거장`}`);
  return `${legs.join(" <b class='xf'>환승</b> ")}<br><span class="sub">역까지 걸어서 ${fmtMin(t.access)}, 내려서 ${fmtMin(t.egress)}</span>`;
}

function mapResult() {
  const el = document.getElementById("m-result"); if (!el) return;
  const p = PLACES.find(x => x.id === mapS.sel);
  if (!p) { el.innerHTML = `<p class="m-hint">${ic("pin")}가고 싶은 곳을 누르면 길과 시간이 바로 나와요</p>`; return; }
  const w = mapS.walk[p.id], t = mapS.tr[p.id], a = AREAS[p.area];
  if (!w) { el.innerHTML = `<div class="m-res"><div class="m-res-h" style="--c:${a.c}"><small>${a.name}</small><b>${p.name}</b><a class="m-gmap" href="${gmapUrl(p, mapS.mode)}" target="_blank" rel="noopener" aria-label="${p.name} 구글맵에서 길찾기">${ic("pin")}구글맵</a><button class="m-x" type="button" data-map="close" aria-label="닫기">×</button></div><p class="m-how">내 위치를 확인하는 중이에요.</p></div>`; return; }
  const how = mapS.mode === "walk"
    ? `지도의 <b class="walkc">초록 선</b>을 따라 걸어가요.${t && t.min < w.min ? " 대중교통이 더 빨라요." : !t ? " 가까워서 지하철은 필요 없어요." : ""}`
    : t ? transitText(t) : "가까워서 지하철 탈 필요 없이 걸어가면 돼요.";
  el.innerHTML = `
    <div class="m-res">
      <div class="m-res-h" style="--c:${a.c}"><small>${a.name}</small><b>${p.name}</b><a class="m-gmap" href="${gmapUrl(p, mapS.mode)}" target="_blank" rel="noopener" aria-label="${p.name} 구글맵에서 길찾기">${ic("pin")}구글맵</a><button class="m-x" type="button" data-map="close" aria-label="닫기">×</button></div>
      <div class="m-stats">
        <div class="st"><small>거리</small><b>${fmtM(w.m)}</b></div>
        <button class="st mode${mapS.mode === "walk" ? " on" : ""}" type="button" data-map="mode" data-mode="walk" aria-pressed="${mapS.mode === "walk"}"><small>${ic("walk")}도보</small><b>${fmtMin(w.min).replace(/(\d+)/g, "$1<i>").replace(/(시간|분)/g, "$1</i>")}</b></button>
        <button class="st mode${mapS.mode === "transit" ? " on" : ""}" type="button" data-map="mode" data-mode="transit" aria-pressed="${mapS.mode === "transit"}"${t ? "" : " disabled"}><small>${ic("train")}대중교통</small><b>${t ? fmtMin(t.min).replace(/(\d+)/g, "$1<i>").replace(/(시간|분)/g, "$1</i>") : "—"}</b></button>
      </div>
      <p class="m-how">${how}${p.approx ? `<br><span class="sub">핀 위치는 건물 기준 대략이에요.</span>` : ""}</p>
    </div>`;
}

function pinIcon(p, on) {
  const s = on ? 30 : 18;
  return L.divIcon({ className: "", iconSize: [s, s], iconAnchor: [s / 2, s / 2],
    html: `<span class="pin-dot${on ? " on" : ""}" style="--c:${AREAS[p.area].c}"></span>` });
}

function sheetPad() {
  const sh = document.getElementById("m-sheet"), h = sh ? sh.getBoundingClientRect().height : 0;
  return { paddingTopLeft: [30, 80], paddingBottomRight: [30, h + 24] };
}

async function initMap() {
  if (LMAP) { LMAP.remove(); LMAP = null; LME = null; }
  try { await loadLeaflet(); } catch { document.getElementById("lmap").innerHTML = `<p class="m-fail">지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>`; }
  if (!document.getElementById("lmap") || !window.L) { mapList(); mapResult(); return; }
  LMAP = L.map("lmap", { zoomControl: false, attributionControl: false }).setView([33.5880, 130.4040], 14);
  L.control.attribution({ position: "topright", prefix: false }).addTo(LMAP);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(LMAP);
  LROUTE = L.layerGroup().addTo(LMAP);
  LMK = {};
  PLACES.forEach(p => {
    LMK[p.id] = L.marker(p.ll, { icon: pinIcon(p, false), title: p.name, keyboard: false }).addTo(LMAP)
      .on("click", () => mapPick(p.id));
  });
  mapList(); mapResult();
  if (mapS.origin) { mapMe(); if (mapS.sel) mapPick(mapS.sel, true); }
  else mapLocate();
}

function mapMe() {
  const o = document.getElementById("m-origin");
  if (o) o.innerHTML = `${ic("target")}<span>${mapS.how}</span>`;
  if (!LMAP) return;
  if (LME) LME.remove();
  LME = L.marker(mapS.origin, { icon: L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11], html: `<span class="me-dot"></span>` }), zIndexOffset: 1000, keyboard: false }).addTo(LMAP);
}

async function mapSetOrigin(ll, how) {
  mapS.origin = ll; mapS.how = how; mapS.loading = true; mapList(); mapMe();
  mapS.tr = {}; PLACES.forEach(p => mapS.tr[p.id] = transitPlan(ll, p.ll));
  const walk = {};
  try {
    const r = await fetch(`${OSRM}/table/v1/foot/${[ll, ...PLACES.map(p => p.ll)].map(lnglat).join(";")}?sources=0&annotations=duration,distance`);
    const j = await r.json();
    PLACES.forEach((p, i) => { const d = j.durations[0][i + 1], m = j.distances[0][i + 1]; walk[p.id] = d == null ? null : { min: d / 60, m }; });
  } catch { /* 길 정보가 안 오면 직선거리로 어림 */ }
  PLACES.forEach(p => { if (!walk[p.id]) { const m = geoDist(ll, p.ll) * 1.25; walk[p.id] = { min: m / 75, m }; } });
  mapS.walk = walk; mapS.loading = false;
  mapList(); mapResult();
  if (mapS.sel) mapRoute();
  else if (LMAP && how.startsWith("내 위치")) LMAP.setView(ll, 15, { animate: false });
}

function mapLocate() {
  const fallback = why => mapSetOrigin(TENJIN_LL, `텐진역 기준 (${why})`);
  const o = document.getElementById("m-origin");
  if (o) o.innerHTML = `${ic("target")}<span>내 위치 찾는 중…</span>`;
  if (!navigator.geolocation) return fallback("위치 사용 불가");
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (geoDist(ll, TENJIN_LL) > 40000) return fallback("지금 후쿠오카 밖이에요");
    mapSetOrigin(ll, `내 위치 기준 (오차 ${Math.round(pos.coords.accuracy)}m)`);
  }, err => fallback(err.code === 1 ? "위치 허용 안 됨" : "위치 못 찾음"), { enableHighAccuracy: true, timeout: 12000, maximumAge: 20000 });
}

function mapPick(id, keepMode) {
  const prevSel = mapS.sel;
  mapS.sel = id;
  if (!keepMode) { const w = mapS.walk[id], t = mapS.tr[id]; mapS.mode = t && w && (w.min > 25 || t.min + 3 < w.min) ? "transit" : "walk"; }
  if (LMAP) {
    if (prevSel && LMK[prevSel]) { LMK[prevSel].setIcon(pinIcon(PLACES.find(p => p.id === prevSel), false)).setZIndexOffset(0).unbindTooltip(); }
    const p = PLACES.find(x => x.id === id);
    LMK[id].setIcon(pinIcon(p, true)).setZIndexOffset(900).bindTooltip(p.name, { permanent: true, direction: "top", offset: [0, -14], className: "m-tip" }).openTooltip();
  }
  mapList(); mapResult(); mapRoute();
}

async function mapRoute() {
  if (!LMAP || !LROUTE) return;
  LROUTE.clearLayers();
  const p = PLACES.find(x => x.id === mapS.sel), o = mapS.origin;
  if (!p || !o) return;
  const tok = ++routeToken, pts = [o, p.ll];
  const dash = (a, b) => L.polyline([a, b], { color: "#4a5b59", weight: 4, dashArray: "2 9", lineCap: "round" }).addTo(LROUTE);
  if (mapS.mode === "walk") {
    let line = [o, p.ll];
    try {
      const r = await fetch(`${OSRM}/route/v1/foot/${lnglat(o)};${lnglat(p.ll)}?overview=full&geometries=geojson`);
      const j = await r.json(); line = j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    } catch { /* 직선으로 표시 */ }
    if (tok !== routeToken) return;
    L.polyline(line, { color: "#ffffff", weight: 10, opacity: .95 }).addTo(LROUTE);
    L.polyline(line, { color: "#1f8f45", weight: 6 }).addTo(LROUTE);
    pts.push(...line);
  } else {
    const t = mapS.tr[p.id]; if (!t) return;
    const at = n => n === "O" ? o : n === "D" ? p.ll : stLL(n);
    t.edges.forEach(e => { if (e.type !== "ride") dash(at(e.from), at(e.to)); });
    t.legs.forEach(l => {
      const ch = l.chain.map(stLL), c = LINES[l.line].c;
      L.polyline(ch, { color: "#ffffff", weight: 11, opacity: .95 }).addTo(LROUTE);
      L.polyline(ch, { color: c, weight: 7 }).addTo(LROUTE);
      [l.from, l.to].forEach(n => L.circleMarker(stLL(n), { radius: 6, color: c, weight: 3, fillColor: "#fff", fillOpacity: 1 })
        .bindTooltip(ST[n][0], { permanent: true, direction: "right", offset: [8, 0], className: "m-st" }).addTo(LROUTE));
      pts.push(...ch);
    });
  }
  LMAP.fitBounds(L.latLngBounds(pts), { ...sheetPad(), maxZoom: 17, animate: false });
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-map]"); if (!b) return;
  const a = b.dataset.map;
  if (a === "locate") mapLocate();
  if (a === "sheet") { mapS.mini = !mapS.mini; document.getElementById("m-sheet").classList.toggle("mini", mapS.mini); }
  if (a === "area") { mapS.area = b.dataset.area; mapList(); document.getElementById("m-list").scrollTop = 0; }
  if (a === "pick") mapPick(b.dataset.id);
  if (a === "mode") { mapS.mode = b.dataset.mode; mapResult(); mapRoute(); }
  if (a === "close") {
    const prev = mapS.sel; mapS.sel = null; routeToken++;
    if (LROUTE) LROUTE.clearLayers();
    if (LMK[prev]) LMK[prev].setIcon(pinIcon(PLACES.find(p => p.id === prev), false)).unbindTooltip();
    mapList(); mapResult();
  }
});

      </div>
      <div class="fl-no"><b>${f.code}</b><span>${f.air}</span></div>
      <dl class="fl-notes">${f.notes.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
      <div class="fl-links">${f.links.map(([u, t]) => `<a class="map" href="${u}" target="_blank" rel="noopener">${ic("link")}${t}</a>`).join("")}</div>
    </article>`;
}

function rushBlock(list, mine, title, sub, verb) {
  const m = hhmm(list.find(x => x[1] === mine)[0]);
  const near = list.filter(x => Math.abs(hhmm(x[0]) - m) <= 60);
  const tight = near.filter(x => Math.abs(hhmm(x[0]) - m) <= 30);
  const slots = [];
  for (let s = Math.floor((m - 120) / 30) * 30; s < m + 120; s += 30) {
    const n = list.filter(x => hhmm(x[0]) >= s && hhmm(x[0]) < s + 30).length;
    const lab = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    slots.push({ s, n, lab, mine: m >= s && m < s + 30 });
  }
  const max = Math.max(...slots.map(x => x.n), 1);
  return `
    <section class="rush">
      <h3>${title}</h3>
      <p class="rush-sub">${sub}</p>
      <div class="rush-big">
        <div><b>${tight.length}</b><span>앞뒤 30분 안에 ${verb}<br>(우리 비행기 포함)</span></div>
        <div><b>${near.length}</b><span>앞뒤 1시간 안에 ${verb}</span></div>
        <div><b>${list.length}</b><span>하루 전체 국제선</span></div>
      </div>
      <ul class="rush-bars">${slots.map(x => `
        <li class="${x.mine ? "mine" : ""}"><span class="t">${x.lab}</span>
          <span class="b"><i style="width:${x.n / max * 100}%"></i></span>
          <span class="n">${x.n}편${x.mine ? " <em>우리</em>" : ""}</span></li>`).join("")}</ul>
      <details class="rush-list"><summary>앞뒤 1시간 비행기 ${near.length}편 보기</summary>
        <ul>${near.map(x => `<li class="${x[1] === mine ? "mine" : ""}"><time>${x[0]}</time><b>${x[1]}</b><span>${x[2]}</span><small>${x[3]}</small></li>`).join("")}</ul>
      </details>
    </section>`;
}

function flightView() {
  return `
    <div class="gutter">
      <div class="p-head"><a class="back" href="#">${ic("back")}목록</a><span class="pill-brand">Fukuoka Trip Advisor</span></div>
      <h2 class="p-title">항공편</h2>
      <p class="p-lede">나봉수봉 비행기 시간과 체크인 카운터, 짐 찾는 곳이에요.</p>
      <div class="fl-cards">${FLIGHTS.map(flightCard).join("")}</div>
      ${rushBlock(FUK.arr, "LJ513", "12월 1일 후쿠오카공항 도착 혼잡도", "LJ513이 내리는 15:55 전후로 다른 나라에서 들어오는 국제선이에요. 많을수록 입국심사 줄이 길어져요.", "도착")}
      <p class="note">혼잡도는 후쿠오카공항 공식 운항표 기준이에요. 12월 운항표가 아직 안 나와서 같은 요일인 11월 24일(화) 도착편으로 셌어요. 지연이나 결항은 반영되지 않아요.</p>
      <a class="home-btn" href="#">${ic("grid")}일정 보러 가기</a>
    </div>`;
}

function render(scroll = true) {
  const id = location.hash.slice(1);
  const s = SPOTS.find(x => x.id === id);
  document.getElementById("app").innerHTML =
    id === "weather" && EMBED_WEATHER ? weatherView() : id === "pack" ? pack() : id === "map" ? mapView() : id === "flight" ? flightView() : s ? detail(s) : home();
  if (scroll) window.scrollTo(0, 0);
  if (id === "map") initMap(); else { if (LMAP) { LMAP.remove(); LMAP = null; LME = null; } }
}
addEventListener("hashchange", () => render());
render();
setInterval(() => { if (!["#weather", "#map"].includes(location.hash)) render(false); }, 60000); // 1분마다 시계와 영업 표시 갱신
</script>
